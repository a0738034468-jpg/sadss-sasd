<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>黃逸森SDGs不塑永續-淨灘</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Zen Maru Gothic', sans-serif;
            user-select: none;
            overflow: hidden;
            touch-action: manipulation;
        }

        /* 陽光與波浪動畫 */
        .wave {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 1000% 1000% 0 0;
            position: absolute;
            width: 200%;
            height: 100px;
            animation: wave 10s infinite linear;
        }

        @keyframes wave {
            0% { transform: translateX(0) translateZ(0) scaleY(1); }
            50% { transform: translateX(-25%) translateZ(0) scaleY(0.85); }
            100% { transform: translateX(-50%) translateZ(0) scaleY(1); }
        }

        /* 垃圾圖示懸停與點擊效果 */
        .trash-item {
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), filter 0.2s;
            cursor: pointer;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.25));
        }
        
        .trash-item:hover {
            transform: scale(1.25) rotate(0deg) !important;
            filter: drop-shadow(0px 8px 15px rgba(0,0,0,0.35)) brightness(1.1);
            z-index: 40 !important;
        }

        /* 漂浮分數彈出動畫 */
        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(0.8);
            }
            50% {
                opacity: 1;
                transform: translateY(-30px) scale(1.3);
            }
            100% {
                opacity: 0;
                transform: translateY(-60px) scale(1);
            }
        }

        .score-popup {
            position: absolute;
            animation: floatUp 0.8s ease-out forwards;
            pointer-events: none;
            font-weight: 900;
            text-shadow: 2px 2px 0px #fff, -2px -2px 0px #fff, 2px -2px 0px #fff, -2px 2px 0px #fff;
            z-index: 50;
        }

        /* 清除垃圾時的水泡消散動畫 */
        @keyframes popOut {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.8; }
            100% { transform: scale(0); opacity: 0; }
        }

        .trash-collected {
            animation: popOut 0.25s ease-out forwards !important;
            pointer-events: none;
        }

        /* 閃爍陽光 */
        .sun-ray {
            background: radial-gradient(circle, rgba(255,235,59,0.3) 0%, rgba(255,235,59,0) 70%);
        }
    </style>
</head>
<body class="h-screen w-screen relative bg-gradient-to-b from-sky-300 via-sky-200 to-amber-100">

    <!-- 背景天際線與陽光 -->
    <div class="absolute top-0 left-0 w-full h-1/2 overflow-hidden pointer-events-none">
        <!-- 太陽 -->
        <div class="absolute -top-12 -left-12 w-48 h-48 bg-yellow-300 rounded-full blur-sm opacity-90 animate-pulse"></div>
        <div class="sun-ray absolute -top-24 -left-24 w-96 h-96 rounded-full pointer-events-none"></div>
        
        <!-- 雲朵 -->
        <i class="fa-solid fa-cloud text-white/80 text-6xl absolute top-8 left-1/4 animate-bounce" style="animation-duration: 6s;"></i>
        <i class="fa-solid fa-cloud text-white/70 text-8xl absolute top-4 right-1/4 animate-bounce" style="animation-duration: 8s;"></i>
        <i class="fa-solid fa-cloud text-white/60 text-5xl absolute top-16 right-10"></i>

        <!-- 海鷗 -->
        <i class="fa-solid fa-crow text-sky-800/40 text-xl absolute top-20 left-1/3 -rotate-12"></i>
        <i class="fa-solid fa-crow text-sky-800/30 text-lg absolute top-24 left-1/3 transform translate-x-8 -translate-y-4"></i>
    </div>

    <!-- 大海區域 -->
    <div class="absolute top-1/3 left-0 w-full h-1/6 bg-gradient-to-b from-cyan-500 to-blue-600 shadow-inner">
        <!-- 海浪邊緣 -->
        <div class="wave top-0"></div>
        <div class="wave top-2" style="animation-delay: -5s; opacity: 0.5;"></div>
    </div>

    <!-- 沙灘區域（垃圾生成點區，佔據下半部約 55% 的空間） -->
    <div id="beach-area" class="absolute bottom-0 left-0 w-full h-[58%] bg-gradient-to-b from-amber-200 via-amber-300 to-amber-400 border-t-8 border-cyan-200/60 shadow-2xl overflow-hidden">
        <!-- 沙灘紋理裝飾 -->
        <i class="fa-solid fa-umbrella-beach text-amber-500/20 text-9xl absolute bottom-10 right-10 transform -rotate-12 pointer-events-none"></i>
        <i class="fa-solid fa-water text-amber-500/30 text-4xl absolute top-10 left-12 pointer-events-none"></i>
        <i class="fa-solid fa-compact-disc text-amber-500/20 text-3xl absolute bottom-1/3 left-1/4 pointer-events-none"></i>
        <!-- 椰子樹裝飾 -->
        <div class="absolute -bottom-10 -left-10 text-emerald-800/30 pointer-events-none text-9xl transform rotate-45">
            <i class="fa-solid fa-tree"></i>
        </div>
    </div>

    <!-- 頁首 Header -->
    <header class="absolute top-0 left-0 w-full p-4 md:p-6 flex justify-between items-start z-30 pointer-events-none">
        <!-- 頁首左上角標題 -->
        <div class="pointer-events-auto bg-white/80 backdrop-blur-md px-5 py-3 rounded-2xl shadow-lg border-2 border-sky-200">
            <h1 class="text-2xl md:text-3xl font-black text-sky-800 tracking-wide flex items-center gap-2">
                <i class="fa-solid fa-leaf text-emerald-500"></i>
                黃逸森SDGs不塑永續-淨灘
            </h1>
            <p class="text-xs md:text-sm font-bold text-sky-600 mt-0.5">點擊沙灘上的垃圾清理海灘，守護海洋生態！</p>
        </div>

        <!-- 頁首右上角：分數與進度資訊 -->
        <div class="pointer-events-auto flex flex-col md:flex-row gap-3 items-end md:items-center">
            <!-- 音效開關 -->
            <button id="sound-btn" onclick="toggleSound()" class="bg-white/80 hover:bg-white backdrop-blur-md p-3 rounded-2xl shadow-lg border-2 border-sky-200 text-sky-700 transition">
                <i id="sound-icon" class="fa-solid fa-volume-high text-xl"></i>
            </button>

            <!-- 關卡與計分板 -->
            <div class="bg-white/90 backdrop-blur-md px-6 py-3 rounded-2xl shadow-lg border-2 border-amber-300 flex items-center gap-6">
                <!-- 關卡 -->
                <div class="text-center border-r pr-5 border-amber-200">
                    <div class="text-xs font-bold text-amber-700">關卡 (Level)</div>
                    <div id="level-display" class="text-2xl font-black text-amber-600">1</div>
                </div>
                <!-- 剩餘進度 -->
                <div class="text-center border-r pr-5 border-amber-200">
                    <div class="text-xs font-bold text-gray-500">已清理數量</div>
                    <div class="text-xl font-black text-sky-600">
                        <span id="cleaned-count">0</span> <span class="text-sm font-normal text-gray-400">/ 50</span>
                    </div>
                </div>
                <!-- 總分 -->
                <div class="text-center">
                    <div class="text-xs font-bold text-emerald-700">獲得積分</div>
                    <div id="score-display" class="text-3xl font-black text-emerald-600">0</div>
                </div>
            </div>
        </div>
    </header>

    <!-- 浮動遊戲訊息提示 -->
    <div id="toast-msg" class="fixed top-24 left-1/2 transform -translate-x-1/2 bg-emerald-600 text-white font-bold px-6 py-2 rounded-full shadow-2xl opacity-0 transition-all duration-300 pointer-events-none z-40 text-sm md:text-base">
        開始淨灘任務！點選垃圾獲得積分！
    </div>

    <!-- 通關 Modal (任務成功) -->
    <div id="victory-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex justify-center items-center opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-white rounded-3xl p-8 max-w-md w-11/12 text-center shadow-2xl border-4 border-amber-300 transform scale-90 transition-transform duration-300" id="modal-card">
            <div class="w-20 h-20 bg-emerald-100 text-emerald-500 rounded-full flex justify-center items-center mx-auto mb-4 text-4xl shadow-inner animate-bounce">
                <i class="fa-solid fa-trophy"></i>
            </div>
            <h2 class="text-3xl font-black text-gray-800 mb-1">任務成功！</h2>
            <p class="text-sm font-bold text-emerald-600 mb-6">太棒了！海灘恢復了乾淨與美麗！</p>
            
            <!-- 成績統計面板 -->
            <div class="bg-amber-50 rounded-2xl p-4 mb-6 text-left space-y-2 border border-amber-200">
                <div class="flex justify-between items-center text-sm font-bold text-gray-600">
                    <span>完成關卡：</span>
                    <span id="modal-level" class="text-base text-amber-600">Level 1</span>
                </div>
                <div class="flex justify-between items-center text-sm font-bold text-gray-600">
                    <span>清理垃圾總數：</span>
                    <span class="text-base text-sky-600">50 個</span>
                </div>
                <hr class="border-amber-200 my-1">
                <div class="flex justify-between items-center text-base font-black text-gray-800">
                    <span>累積總積分：</span>
                    <span id="modal-score" class="text-2xl text-emerald-600">0</span>
                </div>
            </div>

            <!-- 操作按鈕 -->
            <div class="flex gap-4">
                <button onclick="restartGame()" class="flex-1 py-3 px-4 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold rounded-xl transition shadow-md flex items-center justify-center gap-2">
                    <i class="fa-solid fa-rotate-right"></i> 重新開始
                </button>
                <button onclick="nextLevel()" class="flex-1 py-3 px-4 bg-emerald-500 hover:bg-emerald-600 text-white font-bold rounded-xl transition shadow-lg shadow-emerald-200 flex items-center justify-center gap-2">
                    前往下一關 <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- 遊戲主要邏輯 JavaScript -->
    <script>
        // 垃圾數據設定檔 (種類、圖示/樣式、分數、體積標籤)
        const TRASH_TYPES = [
            {
                name: '塑膠飲料杯',
                size: 'small',
                score: 10,
                iconClass: 'fa-bottle-water text-cyan-400',
                customStyle: 'font-size: 2rem;'
            },
            {
                name: '小寶特瓶',
                size: 'small',
                score: 10,
                iconClass: 'fa-wine-bottle text-blue-400',
                customStyle: 'font-size: 2.2rem;'
            },
            {
                name: '鋁罐',
                size: 'small',
                score: 10,
                iconClass: 'fa-prescription-bottle text-red-400',
                customStyle: 'font-size: 1.8rem;'
            },
            {
                name: '紙類餐盒',
                size: 'medium',
                score: 20,
                iconClass: 'fa-box text-amber-700',
                customStyle: 'font-size: 2.8rem;'
            },
            {
                name: '塑膠袋',
                size: 'medium',
                score: 20,
                iconClass: 'fa-bag-shopping text-teal-300',
                customStyle: 'font-size: 2.6rem;'
            },
            {
                name: '玻璃瓶',
                size: 'medium',
                score: 20,
                iconClass: 'fa-glass-water text-emerald-600',
                customStyle: 'font-size: 2.5rem;'
            },
            {
                name: '保麗龍盒',
                size: 'large',
                score: 30,
                iconClass: 'fa-box-archive text-slate-100',
                customStyle: 'font-size: 3.5rem; filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.15));'
            },
            {
                name: '大型漂流木',
                size: 'large',
                score: 40,
                iconClass: 'fa-tree-city text-amber-900',
                customStyle: 'font-size: 3.8rem;'
            },
            {
                name: '廢棄輪胎',
                size: 'large',
                score: 50,
                iconClass: 'fa-compact-disc text-gray-800',
                customStyle: 'font-size: 4rem;'
            }
        ];

        // 遊戲狀態變數
        let score = 0;
        let cleanedCount = 0;
        let currentLevel = 1;
        const TOTAL_TRASH = 50;
        let soundEnabled = true;

        // Web Audio API 音效生成器 (無需外部音效檔)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if (!soundEnabled) return;
            try {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'collect') {
                    // 清理垃圾輕快音效
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.1);
                } else if (type === 'victory') {
                    // 勝利音效
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                    osc.frequency.setValueAtTime(400, audioCtx.currentTime + 0.1);
                    osc.frequency.setValueAtTime(500, audioCtx.currentTime + 0.2);
                    osc.frequency.setValueAtTime(700, audioCtx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.6);
                }
            } catch (e) {
                console.log('Audio error:', e);
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const icon = document.getElementById('sound-icon');
            if (soundEnabled) {
                icon.className = 'fa-solid fa-volume-high text-xl';
                showToast('音效已開啟');
            } else {
                icon.className = 'fa-solid fa-volume-xmark text-xl text-gray-400';
                showToast('音效已靜音');
            }
        }

        // 提示訊息
        function showToast(msg) {
            const toast = document.getElementById('toast-msg');
            toast.innerText = msg;
            toast.classList.remove('opacity-0');
            setTimeout(() => {
                toast.classList.add('opacity-0');
            }, 2000);
        }

        // 初始化/生成 50 個隨機垃圾
        function generateTrash() {
            const beachArea = document.getElementById('beach-area');
            // 清除現有垃圾
            const existingTrash = beachArea.querySelectorAll('.trash-item');
            existingTrash.forEach(el => el.remove());

            cleanedCount = 0;
            updateUI();

            // 取得沙灘區域邊界尺寸
            const width = beachArea.clientWidth;
            const height = beachArea.clientHeight;

            // 安全邊距，避免垃圾生成出界
            const paddingX = 40;
            const paddingTop = 50;
            const paddingBottom = 60;

            for (let i = 0; i < TOTAL_TRASH; i++) {
                // 隨機選取垃圾種類
                const trashType = TRASH_TYPES[Math.floor(Math.random() * TRASH_TYPES.length)];
                
                // 隨機座標與角度
                const randomX = Math.floor(Math.random() * (width - paddingX * 2)) + paddingX;
                const randomY = Math.floor(Math.random() * (height - paddingTop - paddingBottom)) + paddingTop;
                const randomRotation = Math.floor(Math.random() * 360);

                // 建立垃圾 DOM 元素
                const trashEl = document.createElement('div');
                trashEl.className = 'trash-item absolute flex items-center justify-center select-none';
                trashEl.style.left = `${randomX}px`;
                trashEl.style.top = `${randomY}px`;
                trashEl.style.transform = `rotate(${randomRotation}deg)`;
                trashEl.style.zIndex = Math.floor(randomY); // 使較下方的垃圾覆蓋在較上方的垃圾上

                // 設定圖示與樣式
                trashEl.innerHTML = `<i class="fa-solid ${trashType.iconClass}" style="${trashType.customStyle}"></i>`;

                // 點擊事件處理
                trashEl.addEventListener('click', (e) => collectTrash(e, trashEl, trashType));
                trashEl.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    collectTrash(e.touches[0], trashEl, trashType);
                });

                beachArea.appendChild(trashEl);
            }
        }

        // 撿起垃圾邏輯
        function collectTrash(event, element, trashType) {
            if (element.classList.contains('trash-collected')) return;

            // 播放音效
            playSound('collect');

            // 標記為已清理並觸發消散動畫
            element.classList.add('trash-collected');

            // 增加分數與計數
            score += trashType.score;
            cleanedCount += 1;
            updateUI();

            // 顯示獲得分數浮動數字
            showScorePopup(event.clientX || event.pageX, event.clientY || event.pageY, trashType.score);

            // 移除 DOM
            setTimeout(() => {
                element.remove();
            }, 250);

            // 檢查是否全數清理完成
            if (cleanedCount >= TOTAL_TRASH) {
                setTimeout(() => {
                    showVictoryModal();
                }, 500);
            }
        }

        // 彈出獲得分數動畫數字
        function showScorePopup(x, y, points) {
            const popup = document.createElement('div');
            popup.className = 'score-popup text-amber-500 text-xl md:text-2xl';
            popup.innerText = `+${points}`;
            popup.style.left = `${x - 15}px`;
            popup.style.top = `${y - 20}px`;
            document.body.appendChild(popup);

            setTimeout(() => {
                popup.remove();
            }, 800);
        }

        // 更新介面數值
        function updateUI() {
            document.getElementById('score-display').innerText = score;
            document.getElementById('cleaned-count').innerText = cleanedCount;
            document.getElementById('level-display').innerText = currentLevel;
        }

        // 顯示通關 Modal
        function showVictoryModal() {
            playSound('victory');
            document.getElementById('modal-level').innerText = `Level ${currentLevel}`;
            document.getElementById('modal-score').innerText = score;
            
            const modal = document.getElementById('victory-modal');
            const card = document.getElementById('modal-card');
            
            modal.classList.remove('opacity-0', 'pointer-events-none');
            card.classList.remove('scale-90');
            card.classList.add('scale-100');
        }

        // 關閉 Modal
        function hideVictoryModal() {
            const modal = document.getElementById('victory-modal');
            const card = document.getElementById('modal-card');
            
            modal.classList.add('opacity-0', 'pointer-events-none');
            card.classList.remove('scale-100');
            card.classList.add('scale-90');
        }

        // 前往下一關
        function nextLevel() {
            currentLevel += 1;
            hideVictoryModal();
            generateTrash();
            showToast(`進入 Level ${currentLevel}！繼續清理海灘！`);
        }

        // 重新開始遊戲
        function restartGame() {
            score = 0;
            currentLevel = 1;
            hideVictoryModal();
            generateTrash();
            showToast('遊戲已重置，開始淨灘！');
        }

        // 頁面載入與視窗大小改變監控
        window.onload = () => {
            generateTrash();
            showToast('歡迎來到淨灘遊戲！點選垃圾清理海灘！');
        };

        // 視窗調整大小時自動重新排列（防穿幫）
        let resizeTimeout;
        window.onresize = () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                if (cleanedCount < TOTAL_TRASH) {
                    generateTrash();
                }
            }, 300);
        };
    </script>
</body>
</html>
